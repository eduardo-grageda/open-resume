<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }
  .logo { font-size: 2.25rem; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 0.5rem; }
  .tagline { font-size: 0.875rem; opacity: 0.7; margin-bottom: 2rem; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid rgba(255,255,255,0.25);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status { margin-top: 1.5rem; font-size: 0.8rem; opacity: 0.6; }
  .error { display: none; margin-top: 1.5rem; text-align: center; max-width: 340px; }
  .error.visible { display: block; }
  .error p { font-size: 0.85rem; margin-bottom: 1.25rem; color: #fca5a5; line-height: 1.4; }
  .error button {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    font-family: inherit;
    font-size: 0.8rem;
    padding: 0.5rem 1.75rem;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .error button:hover { background: rgba(255,255,255,0.22); }
  .spinner.hidden { display: none; }
</style>
</head>
<body>
  <div class="logo">Open Resume</div>
  <div class="tagline">Local-first CV manager &amp; job search</div>
  <div class="spinner" id="spinner"></div>
  <div class="status" id="status">Starting services&hellip;</div>
  <div class="error" id="error">
    <p id="error-msg"></p>
    <button onclick="window.close()">Close</button>
  </div>
</body>
</html>
